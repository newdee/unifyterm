# Tokyo Night · UnifyTerm
# The theme in use when the settings name none.
[theme]
foreground = "#c0caf5"
background = "#16161e"
cursor = "#c0caf5"
selection = "#33467c"
ansi = [
  # Black, red, green, yellow, blue, magenta, cyan, white
  "#15161e", "#f7768e", "#9ece6a", "#e0af68", "#7aa2f7", "#bb9af7", "#7dcfff", "#a9b1d6",
  # Bright variants in the same order
  "#414868", "#f7768e", "#9ece6a", "#e0af68", "#7aa2f7", "#bb9af7", "#7dcfff", "#c0caf5",
]

# The prompt UnifyTerm writes when the settings say prompt.enabled = true: how it looks in this theme.
[prompt]
style = "lean"
