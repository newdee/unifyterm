# Every push and pull request, on Windows, macOS and Linux: the checks, a
# release build, the commands' record, a start of the window, and the packages.
name: ci

on:
  push:
    # Branches only: a tag names a commit that a branch's run has already checked.
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # unifyterm's data (history, log, links) in the run's own folder, never a home directory.
  UNIFYTERM_DATA_DIR: ${{ github.workspace }}/ci-data

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux libraries (GPUI's build needs their headers; lavapipe draws without a GPU)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev \
            libvulkan-dev mesa-vulkan-drivers libfontconfig-dev libfreetype-dev xvfb dpkg-dev

      - name: The toolchain rust-toolchain.toml names
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: The ConPTY beside unifyterm.exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh tools/fetch-conpty.ps1

      - name: Format
        run: cargo fmt --all --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Tests (with the 84 commands' record, the same on every system)
        run: cargo test --workspace --locked

      - name: Release build
        run: cargo build --workspace --release --locked

      - name: The programs need no Visual C++ runtime (Windows)
        # A fresh Windows has no VCRUNTIME140.dll: a program that needs it does not start there
        # (.cargo/config.toml links the C runtime in).
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object FullName -match 'Hostx64\\x64' | Select-Object -First 1
          foreach ($program in 'unifyterm.exe', 'ut.exe') {
            $needs = @(& $dumpbin.FullName /nologo /dependents "target/release/$program" | Where-Object { $_ -match 'VCRUNTIME|MSVCP|api-ms-win-crt' } | ForEach-Object { $_.Trim() })
            if ($needs) { throw "$program needs $($needs -join ', ')" }
            "${program}: no C runtime DLL"
          }

      - name: Licenses are listed and allowed
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-about --locked --features cli --version 0.9.3
          pwsh tools/notices.ps1 -Check

      - name: The window starts and runs a command (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:UNIFYTERM_RAW_LOG = "$PWD/smoke.raw"
          $p = Start-Process target/release/unifyterm.exe -ArgumentList '-e','cmd','/c','echo smoke-ok' -PassThru
          if (-not $p.WaitForExit(30000)) { $p.Kill(); throw 'unifyterm did not end' }
          # A release build is a window program: PowerShell waits for it only like this.
          $null = Start-Process target/release/unifyterm.exe -ArgumentList '--replay','smoke.raw' -RedirectStandardOutput smoke.txt -Wait -NoNewWindow
          $screen = Get-Content -Raw smoke.txt
          if ($screen -notmatch 'smoke-ok') { throw "not on the screen: $screen" }
          'smoke-ok on the screen'

      - name: The window starts and runs a command (Linux, X11 on xvfb, lavapipe)
        if: runner.os == 'Linux'
        run: |
          export UNIFYTERM_RAW_LOG="$PWD/smoke.raw"
          timeout 60 xvfb-run -a target/release/unifyterm -e sh -c 'echo smoke-ok'
          target/release/unifyterm --replay smoke.raw | grep smoke-ok

      - name: The window starts and runs a command (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          export UNIFYTERM_RAW_LOG="$PWD/smoke.raw"
          ( target/release/unifyterm -e sh -c 'echo smoke-ok' & pid=$!; sleep 30; kill $pid 2>/dev/null || true ) || true
          target/release/unifyterm --replay smoke.raw | grep smoke-ok

      - name: Package (Windows MSI, WiX)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $version = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).packages | Where-Object name -eq 'unifyterm' | ForEach-Object version
          wix build packaging/windows/unifyterm.wxs -arch x64 -d Version=$version -d BinDir=target/release -d Root=. -o "unifyterm-$version-x64.msi"

      - name: Package (Linux .deb and AppImage)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb -p unifyterm --no-build
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="unifyterm") | .version')
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          LINUXDEPLOY="$PWD/linuxdeploy" APPIMAGE_EXTRACT_AND_RUN=1 bash packaging/linux/appimage.sh "$version"

      - name: Package (macOS .app and .dmg)
        if: runner.os == 'macOS'
        run: |
          version=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[] | select(.name=="unifyterm") | .version')
          bash packaging/macos/make-app.sh "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: unifyterm-${{ matrix.os }}
          if-no-files-found: error
          path: |
            *.msi
            target/debian/*.deb
            *.AppImage
            target/release/*.dmg
