# Publishes site/ (the product page) to GitHub Pages: dfine.tech/unifyterm/.
# Pages was turned on once, by the owner (a workflow's own token may not):
#   gh api -X POST repos/newdee/unifyterm/pages -f build_type=workflow
name: pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancels.
concurrency:
  group: pages
  cancel-in-progress: false

# Two jobs, not one. deploy-pages looks the artifact up by name, and a lookup
# made right after the upload can come back empty (actions/deploy-pages#451:
# both runs for 0.4.0 failed so, with the artifact there). A second job starts
# seconds later; and "re-run failed jobs" then runs the deployment alone,
# without a second upload.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.again.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # The same lookup once more, later: for a list that is still behind.
      - name: Wait before the second try
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: again
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
