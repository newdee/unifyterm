[package]
name = "unifyterm-assist"
description = "unifyterm's AI help with commands: suggest, fix, explain."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5", features = ["json"] }
unifyterm-history = { path = "../history" }
# How near a mistyped name is to a known one: the same rule as for a program's own commands.
unifyterm-programs = { path = "../programs" }
dirs = "6"

[dev-dependencies]
tempfile = "3"
# The example that measures a model reads the settings the terminal reads.
unifyterm-config = { path = "../config" }
