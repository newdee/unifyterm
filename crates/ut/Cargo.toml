[package]
name = "ut"
description = "uni-term's commands: the Unix commands, the same on Windows, macOS and Linux, in one program."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# What every uutils command shares: arguments, messages, exit codes.
uucore = "0.12.0"
# GNU coreutils in Rust (uutils), one crate a command. These 90 build on every platform.
uu_arch = "0.12.0"
uu_b2sum = "0.12.0"
uu_base32 = "0.12.0"
uu_base64 = "0.12.0"
uu_basename = "0.12.0"
uu_basenc = "0.12.0"
uu_cat = "0.12.0"
uu_cksum = "0.12.0"
uu_comm = "0.12.0"
uu_cp = "0.12.0"
uu_csplit = "0.12.0"
uu_cut = "0.12.0"
uu_date = "0.12.0"
uu_dd = "0.12.0"
uu_df = "0.12.0"
uu_dir = "0.12.0"
uu_dircolors = "0.12.0"
uu_dirname = "0.12.0"
uu_du = "0.12.0"
uu_echo = "0.12.0"
uu_env = "0.12.0"
uu_expand = "0.12.0"
uu_expr = "0.12.0"
uu_factor = "0.12.0"
uu_false = "0.12.0"
uu_fmt = "0.12.0"
uu_fold = "0.12.0"
uu_head = "0.12.0"
uu_hostid = "0.12.0"
uu_hostname = "0.12.0"
uu_join = "0.12.0"
uu_kill = "0.12.0"
uu_link = "0.12.0"
uu_ln = "0.12.0"
uu_ls = "0.12.0"
uu_md5sum = "0.12.0"
uu_mkdir = "0.12.0"
uu_mktemp = "0.12.0"
uu_more = "0.12.0"
uu_mv = "0.12.0"
uu_nice = "0.12.0"
uu_nl = "0.12.0"
uu_nohup = "0.12.0"
uu_nproc = "0.12.0"
uu_numfmt = "0.12.0"
uu_od = "0.12.0"
uu_paste = "0.12.0"
uu_pathchk = "0.12.0"
uu_pr = "0.12.0"
uu_printenv = "0.12.0"
uu_printf = "0.12.0"
uu_ptx = "0.12.0"
uu_pwd = "0.12.0"
uu_readlink = "0.12.0"
uu_realpath = "0.12.0"
uu_rm = "0.12.0"
uu_rmdir = "0.12.0"
uu_seq = "0.12.0"
uu_sha1sum = "0.12.0"
uu_sha224sum = "0.12.0"
uu_sha256sum = "0.12.0"
uu_sha384sum = "0.12.0"
uu_sha512sum = "0.12.0"
uu_shred = "0.12.0"
uu_shuf = "0.12.0"
uu_sleep = "0.12.0"
uu_sort = "0.12.0"
uu_split = "0.12.0"
uu_sum = "0.12.0"
uu_sync = "0.12.0"
uu_tac = "0.12.0"
uu_tail = "0.12.0"
uu_tee = "0.12.0"
uu_test = "0.12.0"
uu_timeout = "0.12.0"
uu_touch = "0.12.0"
uu_tr = "0.12.0"
uu_true = "0.12.0"
uu_truncate = "0.12.0"
uu_tsort = "0.12.0"
uu_tty = "0.12.0"
uu_uname = "0.12.0"
uu_unexpand = "0.12.0"
uu_uniq = "0.12.0"
uu_unlink = "0.12.0"
uu_uptime = "0.12.0"
uu_vdir = "0.12.0"
uu_wc = "0.12.0"
uu_whoami = "0.12.0"
uu_yes = "0.12.0"
# find and xargs (uutils findutils), sed (uutils sed), the diff formats (uutils diffutils).
findutils = "0.11.0"
sed = "0.3.0"
diffutils = "0.6.0"
same-file = "1"
uni-history = { path = "../history" }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
terminal_size = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
anyhow = "1"
# ut mcp: JSON-RPC messages.
serde_json = "1"
# ut view VIDEO: q and Ctrl-C while it plays (already in the tree through uu_more).
crossterm = "0.29"
# jq: the jaq interpreter and its formats; jaq's own command line is repeated in src/jq.
jaq-all = { version = "0.4.0", default-features = false, features = ["formats", "std-all"] }
env_logger = { version = "0.10", default-features = false }
log = "0.4"
tempfile = "3"
# grep: ripgrep's searcher and regex matcher, with GNU grep's options and output.
grep-searcher = "0.1.17"
grep-regex = "0.1"
grep-matcher = "0.1"
globset = "0.4"
walkdir = "2"

# These 15 need Unix: owners, modes, devices, logins.
# Wildcards in arguments: on Windows no shell replaces them (src/expand.rs).
[target.'cfg(windows)'.dependencies]
glob = "0.3"
wild = "2.2"

[target.'cfg(unix)'.dependencies]
uu_chgrp = "0.12.0"
uu_chmod = "0.12.0"
uu_chown = "0.12.0"
uu_chroot = "0.12.0"
uu_groups = "0.12.0"
uu_id = "0.12.0"
uu_install = "0.12.0"
uu_logname = "0.12.0"
uu_mkfifo = "0.12.0"
uu_mknod = "0.12.0"
uu_pinky = "0.12.0"
uu_stat = "0.12.0"
uu_stty = "0.12.0"
uu_users = "0.12.0"
uu_who = "0.12.0"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
