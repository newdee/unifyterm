[package]
name = "unifyterm"
description = "One terminal for Windows, macOS and Linux."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# `cargo deb -p unifyterm --no-build` after `cargo build --release`: the .deb with both programs.
[package.metadata.deb]
name = "unifyterm"
maintainer = "newdee <newdee@users.noreply.github.com>"
copyright = "2026, newdee"
license-file = ["../../LICENSE", "0"]
extended-description = "One terminal for Windows, macOS and Linux: the same Unix commands everywhere (ut), a command history you can search as you type, pictures and markdown in the terminal."
section = "x11"
priority = "optional"
# The libraries it links, found by dpkg-shlibdeps; Vulkan is loaded at run time.
depends = "$auto, libvulkan1"
recommends = "mesa-vulkan-drivers, ffmpeg"
assets = [
    ["../../target/release/unifyterm", "usr/bin/", "755"],
    ["../../target/release/ut", "usr/bin/", "755"],
    ["../../packaging/linux/unifyterm.desktop", "usr/share/applications/", "644"],
    ["../../packaging/icons/unifyterm-256.png", "usr/share/icons/hicolor/256x256/apps/unifyterm.png", "644"],
    ["../../packaging/icons/unifyterm.svg", "usr/share/icons/hicolor/scalable/apps/unifyterm.svg", "644"],
    ["../../THIRD-PARTY-NOTICES", "usr/share/doc/unifyterm/", "644"],
]
[lints]
workspace = true

[dependencies]
# The window, text and input (Zed's UI framework).
gpui = "0.2.2"
# The terminal's screen: escape sequences in, a grid of cells out.
alacritty_terminal = "0.26"
# The shell's pty: ConPTY on Windows, a Unix pty elsewhere.
portable-pty = "0.9"
# The channel from the pty's reader thread to the window.
smol = "2"
anyhow = "1"
# What went wrong while running: to stderr and the log file.
log = "0.4"
# The settings file.
serde = { version = "1", features = ["derive"] }
# keepane's list of agents (keepane list-agents -J).
serde_json = "1"
toml = "0.9"
dirs = "6"
unifyterm-config = { path = "../config" }
unifyterm-history = { path = "../history" }
unifyterm-assist = { path = "../assist" }
# What programs say of their own commands: offered while typing, used to put a mistyped one right and to explain.
unifyterm-programs = { path = "../programs" }
regex = "1"
# updates.check: GitHub's latest release (already in the tree through unifyterm-assist).
ureq = { version = "3.5", features = ["json"] }
unicode-width = "0.2"
base64 = "0.22"
# The same version GPUI draws with: its frames are this crate's.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

# The icon and the name Windows shows for the program are part of the program file:
# the window, the taskbar and Explorer take them from there, not from an installer.
[target.'cfg(windows)'.dependencies]
# The keyboard back from a tab's hidden console window: the window in front, its program's parents.
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
